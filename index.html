<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cổng Thông Tin Nghiệp Vụ</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Giao diện chuẩn phong cách Vue của Docsify -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Đang tải dữ liệu hệ thống...</div>
  <script>
    window.$docsify = {
      name: 'Cổng Tri Thức & Nghiệp Vụ',
      repo: '',
      loadSidebar: true, // Kích hoạt thanh menu danh mục bên trái
      subMaxLevel: 3,    // Tự động lấy tiêu đề trang đưa vào menu
      search: 'auto'     // Kích hoạt thanh tìm kiếm toàn trang
    }
  </script>
  <!-- Thư viện mã nguồn mở Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugin tìm kiếm thông minh -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
